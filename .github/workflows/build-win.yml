name: Build Windows installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional tag to attach the installer to (leave empty to only keep the artifact)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-win-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Windows x64 (NSIS)
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write # required to create/upload the GitHub Release on tags

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run engine tests
        run: npm test

      - name: Build NSIS installer
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # unsigned build: never look for a signing certificate

      - name: List build output
        shell: pwsh
        run: Get-ChildItem -Path release -Force | Format-Table Name, Length

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: promax-cabinet-studio-windows-x64
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
          retention-days: 30

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
        run: |
          set -euo pipefail

          if [ -z "${RELEASE_TAG}" ]; then
            echo "No release tag resolved; skipping release upload."
            exit 0
          fi

          shopt -s nullglob
          files=(release/*.exe release/*.blockmap)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No installer found in release/; failing the job."
            exit 1
          fi

          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              --title "Pro.Max Cabinet Studio ${RELEASE_TAG}" \
              --generate-notes
          fi

          gh release upload "${RELEASE_TAG}" "${files[@]}" --clobber
